name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - admin
          - portfolio
          - dj-karsh
          - karsh-core
          - all
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - preview
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.app }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20

jobs:
  # Pre-deployment checks
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # Deploy single app
  deploy-app:
    needs: preflight
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app != 'all' }}
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Build app
        run: npm run build:${{ github.event.inputs.app }}

      - name: Deploy to Vercel (Preview)
        if: ${{ github.event.inputs.environment == 'preview' }}
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd apps/${{ github.event.inputs.app }}

      - name: Deploy to Vercel (Production)
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd apps/${{ github.event.inputs.app }} \
            --prod

  # Deploy all apps
  deploy-all:
    needs: preflight
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.app == 'all' }}
    environment: ${{ github.event.inputs.environment }}
    strategy:
      matrix:
        app: [admin, portfolio, dj-karsh, karsh-core]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Build ${{ matrix.app }}
        run: npm run build:${{ matrix.app }}

      - name: Deploy ${{ matrix.app }} to Vercel
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
              --cwd apps/${{ matrix.app }} \
              --prod
          else
            npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
              --cwd apps/${{ matrix.app }}
          fi

  # Post-deployment verification
  verify:
    needs: [deploy-app, deploy-all]
    if: always() && (needs.deploy-app.result == 'success' || needs.deploy-all.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          echo "Verifying deployment..."
          # Add health check commands here

      - name: Notify success
        run: echo "Deployment completed successfully!"
