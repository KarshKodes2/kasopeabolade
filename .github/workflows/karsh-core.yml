name: Karsh Core CI

on:
  push:
    paths:
      - "apps/karsh-core/**"
      - "packages/**"
    branches: [main]
  pull_request:
    paths:
      - "apps/karsh-core/**"
      - "packages/**"

concurrency:
  group: karsh-core-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Lint
        run: npm run lint -- --filter=karsh-core

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build:karsh-core
